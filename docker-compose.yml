services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: tsms-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: tsms-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

  influxdb:
    image: influxdb:2.7
    container_name: tsms-influxdb
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: admin12345
      DOCKER_INFLUXDB_INIT_ORG: tsms
      DOCKER_INFLUXDB_INIT_BUCKET: tutorial
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: supersecrettoken
    volumes:
      - influxdb-data:/var/lib/influxdb2

  telegraf:
    image: telegraf:1.31
    container_name: tsms-telegraf
    depends_on:
      - kafka
      - influxdb
    environment:
      INFLUX_TOKEN: supersecrettoken
      INFLUX_ORG: tsms
      INFLUX_BUCKET: tutorial
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro

  chronograf:
    image: chronograf:1.10
    container_name: tsms-chronograf
    depends_on:
      - influxdb
      - kapacitor
    environment:
      KAPACITOR_URL: http://kapacitor:9092
    ports:
      - "8888:8888"

  kapacitor:
    image: kapacitor:1.7
    container_name: tsms-kapacitor
    depends_on:
      - influxdb
    ports:
      - "9093:9092"
    volumes:
      - ./kapacitor/kapacitor.conf:/etc/kapacitor/kapacitor.conf:ro
      - kapacitor-data:/var/lib/kapacitor

volumes:
  influxdb-data:
  kapacitor-data:
